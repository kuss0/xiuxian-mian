name: Stability Checks

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Daily reset fixtures and message-log dates use the production game timezone.
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Compatibility tests read the previous persisted-state reader with git show.
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check model tools tests xiuxian.py
      - run: python -m pytest -q --junitxml=test-results.xml
        env:
          XIUXIAN_ALLOW_LIVE_TEST_DB: "0"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: test-results
          path: test-results.xml
